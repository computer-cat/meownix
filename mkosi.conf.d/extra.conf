[Content]
Packages=
		gnome-keyring
		pam-u2f
		fastfetch
		wl-clipboard
		wtype
		cliphist
		kitty
		gvfs
		file-roller
		7zip
		bzip3
		unrar
		unzip
		dpkg
		gnome-disk-utility
		flatpak
		bazaar
		homebrew
		brew-proxy
		quickshell
