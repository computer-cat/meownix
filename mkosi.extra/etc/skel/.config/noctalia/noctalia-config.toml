[notification]
background_opacity = 0.74999998323619366

[osd]
background_opacity = 0.74999998323619366
position_vertical = "center_right"

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true
browser_placement = "floating"
download_dir = "/home/may/Pictures"

[plugins]
enabled = [ "raycursive/niri-displays", "noctalia/notes", "noctalia/wallhaven" ]

[shell]
corner_radius_scale = 0.0
font_family = "Google Sans Flex"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_window_translucent = true
time_format = "{:%-I:%M %p}"

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

[theme]
builtin = "Tokyo-Night"
community_palette = "Solarized"
custom_palette = "abstract-fth"
source = "custom"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kitty", "starship" ]
    community_ids = [ "zen-browser", "steam" ]
    enable_builtin_templates = true

        [theme.templates.user.firefox]
        input_path = "/home/may/.config/matugen/templates/firefox.css"
        output_path = "/home/may/.config/mozilla/firefox/wxceqwf1.default-release/chrome/theme/colors/dark.css"

        [theme.templates.user.keyboard]
        input_path = "/home/may/.config/matugen/templates/keyboard-color"
        output_path = "/home/may/.config/matugen/keyboard-color"
        post_hook = "~/.local/bin/update-keyboard-color.sh"

        [theme.templates.user.system24]
        input_path = "/home/may/.config/matugen/templates/system24.css"
        output_path = "/home/may/.var/app/dev.vencord.Vesktop/config/vesktop/themes/system24.matugen.css"

        [theme.templates.user.tapiriqs]
        input_path = "$XDG_CONFIG_HOME/matugen/templates/tapiri-theme.json"
        output_path = "$XDG_CONFIG_HOME/quickshell/tapiri/theme.json"

[wallpaper]
directory = "/home/may/Pictures"

    [wallpaper.default]
    path = "/home/may/Pictures/wallhaven-rrljjq.jpg"

    [wallpaper.last]
    path = "/home/may/Pictures/wallhaven-rrljjq.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/may/Pictures/wallhaven-rrljjq.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/may/Pictures/wallhaven-5ymyz7.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/may/Pictures/wallhaven-rrljjq.jpg"

    [[wallpaper.favorite]]
    path = "/home/may/Pictures/wallpaper.jpg"
    theme_mode = "auto"

[weather]
unit = "imperial"

[widget.audio_visualizer]
bands = 30
width = 200

[widget.bar]
show_resolution = false
type = "raycursive/niri-displays:bar"

[widget.clock]
format = "{:%-I:%M %p}"
vertical_format = "{:%-I:%M}"

[widget.control-center]
glyph = "settings"

[widget.network]
show_label = false

[widget.temp]
glyph = "cpu"
visualization = "none"

[widget.tray]
detached_panel = true
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
empty_color = "outline"
focused_color = "on_surface"
occupied_color = "on_surface_variant"
style = "minimal"
